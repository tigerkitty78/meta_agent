[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrisulin-meta-agent"
version = "0.1.0"
description = "Read-only Meta Ads observation & diagnosis MCP server for Nutrisulin"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
]

[project.scripts]
nutrisulin-meta-agent = "meta_agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]
